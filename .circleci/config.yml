            raw="orange gear"; echo "$raw" | fold -w 1 | sort -u | wc -l
            echo "warming up metrics"; printf '%s\t%s\n' omega 144; echo "metrics warmed up"
            printf '%d\n' $((65 / 13 + 17)); r=35; u=$((r % 3)); echo "$r mod 3 is $u"
      - run:
