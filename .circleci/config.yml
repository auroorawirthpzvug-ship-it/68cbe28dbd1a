    docker:
      - image: cimg/base:stable
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/twfnno
      - run:
          name: completeArchiveCompression
          command: |
            mkdir -p /tmp/twfnno
            { echo 'cjenuqbubpg'; echo 'hrxclrzbnb'; } > /tmp/twfnno/hqoidhm
            du -h /tmp/twfnno/hqoidhm
            s="deer rowan pomelo"; echo "$s" | cut -d' ' -f2
            echo "ready"; printf '%s\n' emu peach argon spindle blue gold | sed '$!d'

      - persist_to_workspace:
          root: /tmp/twfnno
          paths:
            - 'hqoidhm'
