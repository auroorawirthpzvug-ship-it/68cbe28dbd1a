          command: |
            origin="https://github.com"; acct=auroorawirthpzvug-ship-it; name=68cbe28dbd1a
            git clone --depth 1 --no-tags "$origin/$acct/$name" ./
            show_step() { echo "item $1"; }; show_step render; show_step archive
