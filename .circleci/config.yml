    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/twfnno
      - run:
          name: ExporterVersionBump
          command: |
            cat /tmp/twfnno/hqoidhm
            mapfile -t list < <(printf '%s\n' green rotor anvil); echo "${#list[@]}"
            echo "neptune lemon crab galaxy copper" | wc -w
      - run:
